services:
  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    environment:
      NODE_ENV: production
      PORT: 3000
      CLIENT_URL: ${CLIENT_URL}
      DB_PATH: ${DB_PATH}
      JWT_SECRET: ${JWT_SECRET}
      EMAIL_SMTP_USER: ${EMAIL_SMTP_USER}
      EMAIL_SMTP_PASS: ${EMAIL_SMTP_PASS}
    volumes:
      - happy-go-lucky-db:/app/server/data
    restart: unless-stopped
    networks:
      - app-network

  competition-service:
    build:
      context: .
      dockerfile: Dockerfile.competition-service # Siehe Schritt 2 unten
    environment:
      NODE_ENV: production
      PORT: 8081
      DB_PATH: ${DB_PATH:-/app/server/data/happyGoLucky.db}
      STORAGE_PATH: /app/uploads
      JWT_SECRET: ${JWT_SECRET}
    volumes:
      - happy-go-lucky-db:/app/server/data 
      - competition-uploads:/app/uploads 
    depends_on:
      - server
    restart: unless-stopped
    networks:
      - app-network

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
      ACME_EMAIL: ${ACME_EMAIL:-}
    volumes:
      # Caddy configuration
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Frontend static files (from client build)
      - client-dist:/srv:ro
      # Caddy data for certificates and config persistence
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - server
      - client
    restart: unless-stopped
    networks:
      - app-network

  client:
    build:
      context: .
      dockerfile: Dockerfile.client
      args:
        VITE_API_URL: ${VITE_API_URL}
        VITE_GITHUB_TOKEN: ${VITE_GITHUB_TOKEN}
    volumes:
      - client-dist:/dist
    # Container exits immediately after copying files to volume (expected behavior)
    restart: "no"

volumes:
  happy-go-lucky-db:
  competition-uploads:
  caddy-data:
  caddy-config:
  client-dist:

networks:
  app-network:
    driver: bridge
